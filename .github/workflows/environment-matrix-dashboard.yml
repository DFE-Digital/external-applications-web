name: Environment Matrix Dashboard

on:
  workflow_dispatch:
  deployment_status:

concurrency:
  group: environment-dashboard
  cancel-in-progress: true

jobs:
  generate-dashboard:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      deployments: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
  
      - name: Generate Matrix Table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/generate_environment_matrix.py

      - name: Commit README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md

          git diff --cached --quiet || git commit -m "Update deployment matrix"

          git push
